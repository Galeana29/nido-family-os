household:
  name: "Home"
  timezone: "America/Vancouver"
carePlan:
  instructions:
    - id: instruction-feeding-structure
      authorType: clinician
      text: "Use structured daytime feeding opportunities instead of continuous on-demand milk feeds."
      locked: true
      priority: P0
programs:
  - id: program-gradual-daytime-nursing
    stage: 2
    source: caregiver-approved
    pauseConditions:
      - type: dayMode
        equals: sick
      - type: consecutiveMealRatings
        ratings: [none, taste]
        count: 3
        note: "Example deterministic configuration only; real thresholds must be explicitly approved by the program owner."
