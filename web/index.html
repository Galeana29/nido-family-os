<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NIDO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NIDO">
<meta name="theme-color" content="#12100e">
</head>
<body>
<main id="app">
  <header class="head">
    <div>
      <p class="greeting" id="greeting">…</p>
      <p class="date" id="dateLine"></p>
    </div>
    <button class="lang" id="lang" type="button" aria-label="Cambiar idioma">ES</button>
  </header>

  <button class="stage" id="stage" type="button">
    <span class="stageName" id="stageName"></span>
    <span class="stageGoal" id="stageGoal"></span>
    <span class="stageMore" id="stageMore">Ver la etapa y el semáforo →</span>
  </button>

  <p class="dayState" id="dayState"></p>

  <section class="card" id="nowCard" hidden>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="title" id="title"></h1>
    <p class="range"><span id="timeRange"></span> · <span id="statusLabel"></span></p>
    <p class="why" id="explanation" hidden></p>
    <p class="food" id="nowFood" hidden></p>
    <button class="primary" id="primary" type="button"></button>
    <div class="secondary">
      <button id="delay" type="button">+15 min</button>
      <button id="skip" type="button">Hoy no</button>
      <button id="detail" type="button">Cómo</button>
    </div>
  </section>

  <section class="empty" id="emptyCard" hidden>
    <p id="emptyText">Nada pendiente por ahora.</p>
  </section>

  <ul class="notices" id="notices"></ul>

  <h2 class="sectionTitle" id="dayTitle">El día completo</h2>
  <ol class="day" id="day"></ol>

  <section class="refs">
    <details>
      <summary id="rulesTitle">Reglas de la casa</summary>
      <ol class="houseRules" id="houseRules"></ol>
    </details>
    <details>
      <summary id="protocolTitle">Si no come</summary>
      <div id="protocols"></div>
    </details>
    <details>
      <summary id="sourcesTitle">De dónde sale esto</summary>
      <p class="disclaimer" id="disclaimer"></p>
      <ul class="sources" id="sources"></ul>
    </details>
  </section>

  <footer class="clock">
    <p class="clockLabel"><span id="clockKind">Hora real</span>: <strong id="clockNow">—</strong></p>
    <details class="demo">
      <summary id="demoTitle">Probar el día sin esperarlo</summary>
      <div class="clockButtons">
        <button id="plus15" type="button">+15 min</button>
        <button id="plus60" type="button">+1 h</button>
        <button id="realtime" type="button">Volver a la hora real</button>
        <button id="reset" type="button">Borrar lo registrado</button>
      </div>
    </details>
    <p class="engine" id="engineNote"></p>
  </footer>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheetBack" id="sheetBack"></div>
  <div class="sheetBody" role="dialog" aria-modal="true">
    <div class="sheetGrip"></div>
    <div id="sheetContent"></div>
  </div>
</div>

<div class="boot" id="boot">
  <p id="bootText">Cargando el motor…</p>
  <div class="bar"><div class="fill" id="bootFill"></div></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
